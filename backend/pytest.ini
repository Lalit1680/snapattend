# pytest configuration for the SnapAttend backend.
#
# Run from `backend/`:  python -m pytest
#
# The suite is hermetic on purpose — no MongoDB, no ChromaDB, no dlib/torch — so
# it runs on a clean checkout before any of the heavy native wheels are built.
# `tests/conftest.py` documents how that is achieved and enforces it.

[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
