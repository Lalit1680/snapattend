# pytest configuration for SnapAttend.
#
# Run from the project root:  pytest
#
# tests/conftest.py makes this hermetic: it stands in for dlib, streamlit,
# supabase, resemblyzer and librosa when they aren't installed, so the suite
# can run in a clean environment (e.g. CI) before the heavier native
# dependencies (dlib in particular) have been built. It never shadows a real
# installation if one is present.

[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
