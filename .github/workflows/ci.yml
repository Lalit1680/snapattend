name: CI

# Installs the project's real dependencies and runs the pytest suite in
# tests/. tests/conftest.py stands in for Supabase/dlib credentials and
# native builds where needed, so this does not require any repo or
# organisation secrets to pass.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest
